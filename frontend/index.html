<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: 入力フォーカス時の自動ズームを抑止 (ホーム画面PWA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <!-- 計器盤の見出し・数値用フォント(オフライン時はシステムにフォールバック) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ascend" />
    <title>Ascend</title>
    <!-- FOUC 回避: React 起動前に data-theme を確定する。lib/theme.ts と同じ規約。 -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("healthcare:theme") || "system";
          var actual = p === "system"
            ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
            : p;
          document.documentElement.dataset.theme = actual;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", actual === "light" ? "#eceff3" : "#0a0e14");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <!--
      起動ガード: Service Worker が**古い index.html** を返し、そこが参照する JS が
      サーバから消えている (404) と、アプリは何も描画できず「開かない」ように見える。
      実際に発生した: 端末の PWA が index-C-SfVG-5.js を要求し続けたが、サーバ側は
      index-Cgm2AqCE.js に入れ替わっており 404。SW は自分を更新できない限りこの状態から
      永久に抜けられない。

      そこで「一定時間たっても React が #root に何も描かなかった」場合だけ、
      SW を登録解除しキャッシュを捨てて**1回だけ**リロードする。
      ⚠️ sessionStorage で1回に制限する。無条件だとリロードループになり、
      本当に描画が遅いだけの端末を無限に再読み込みさせてしまう。
    -->
    <script>
      (function () {
        var KEY = "ascend:boot-recovered";
        function looksDead() {
          var r = document.getElementById("root");
          return !r || r.childElementCount === 0;
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!looksDead()) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }
            try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, "1"); } catch (e) { return; }
            var done = function () { location.reload(); };
            var jobs = [];
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            Promise.all(jobs).then(done, done);
          }, 8000);
        });
      })();
    </script>
  </head>
  <body class="bg-void text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
